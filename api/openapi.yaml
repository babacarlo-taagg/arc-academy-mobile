    TypeEvenement:
      type: string
      enum: [lecon_ouverte, lecon_terminee, scorm_etat, temps_passe]
      description: |
        - `lecon_ouverte` : `donnees` vide.
        - `lecon_terminee` : `donnees` vide (articles et PDF ; un SCORM se termine par son état).
        - `scorm_etat` : objet `EtatScorm` (format « commit » de scorm-again).
        - `temps_passe` : `{ secondes }`, temps passé dans la leçon depuis le dernier événement de ce type.
    EtatScorm:
      type: object
      properties:
        completionStatus: { type: string, enum: [unknown, incomplete, completed] }
        successStatus: { type: string, enum: [unknown, passed, failed] }
        score:
          type: object
          properties:
            raw: { type: number }
            min: { type: number }
            max: { type: number }
        totalTimeSeconds: { type: number }
        runtimeData: { type: object, description: "État cmi complet, pour la reprise." }
    Evenement:
      type: object
      required: [id, type, coursId, leconId, survenuLe]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/TypeEvenement' }
        coursId: { type: integer }
        leconId: { type: integer }
        survenuLe: { type: string, format: date-time, description: Heure du téléphone (peut être fausse ; le serveur note aussi l'heure de réception). }
        donnees:
          description: Vide, `{ secondes }` (temps_passe) ou état SCORM (scorm_etat).
          allOf:
            - $ref: '#/components/schemas/EtatScorm'
          additionalProperties: true
    PaquetEvenements:
      type: object
      required: [appareilId, evenements]
      properties:
        appareilId: { type: string, format: uuid }
        evenements:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/Evenement' }
    ResultatEvenement:
      type: object
      required: [id, statut]
      properties:
        id: { type: string, format: uuid }
        statut: { type: string, enum: [accepte, deja_recu, refuse] }
        raison: { type: string, description: "Si refusé : `lecon_inconnue`, `acces_retire`, `donnees_invalides`, `type_inconnu`." }
    ResultatSynchro:
      type: object
      required: [resultats, etat]
      properties:
        resultats:
          type: array
          items: { $ref: '#/components/schemas/ResultatEvenement' }
        etat: { $ref: '#/components/schemas/EtatSynchro' }
      example:
        resultats:
          - { id: 0b8f3a3e-8a1c-4c1e-9a52-6f1d2d3c4b5a, statut: accepte }
          - { id: 3d6f8c1a-2b4e-4f6a-8c9d-0e1f2a3b4c5d, statut: deja_recu }
        etat:
          genereLe: '2026-10-21T10:00:05Z'
          formations:
            - coursId: 12
              progression: 35
              lecons:
                - { leconId: 344, terminee: true }
                - { leconId: 345, terminee: true, scorm: { completionStatus: completed, successStatus: passed, scorePourcent: 80 } }

    EtatLecon:
      type: object
      required: [leconId, terminee]
      properties:
        leconId: { type: integer }
        terminee: { type: boolean }
        scorm:
          type: object
          properties:
            completionStatus: { type: string, enum: [unknown, incomplete, completed] }
            successStatus: { type: string, enum: [unknown, passed, failed] }
            scorePourcent: { type: [number, 'null'] }
            totalTimeSeconds: { type: integer }
            runtimeData: { type: object, description: Seulement si `coursId` est demandé. }
    EtatFormation:
      type: object
      required: [coursId, progression, lecons]
      properties:
        coursId: { type: integer }
        progression: { type: integer, minimum: 0, maximum: 100 }
        lecons:
          type: array
          items: { $ref: '#/components/schemas/EtatLecon' }
    EtatSynchro:
      type: object
      required: [genereLe, formations]
      properties:
        genereLe: { type: string, format: date-time }
        formations:
          type: array
          items: { $ref: '#/components/schemas/EtatFormation' }
      example:
        genereLe: '2026-10-21T10:00:05Z'
        formations:
          - coursId: 12
            progression: 35
            lecons:
              - { leconId: 344, terminee: true }
              - { leconId: 345, terminee: false, scorm: { completionStatus: incomplete, successStatus: unknown, scorePourcent: null, totalTimeSeconds: 600 } }

    Aide:
      type: object
      required: [emailSupport]
      properties:
        emailSupport: { type: string }
        messageSansEmail: { type: string, description: "Texte affiché à qui n'a pas d'e-mail sur son compte." }
      example:
        emailSupport: academy@africaresourcecentre.org
        messageSansEmail: Ton adresse e-mail n'est pas encore enregistrée. Demande à ton responsable de formation de l'ajouter à ton compte ARC.
