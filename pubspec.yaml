name: arc_academy
description: "ARC Academy Mobile : formation continue hors ligne pour les acteurs de santé"
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Écrans et état
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  intl: ^0.20.3

  # Réseau et synchronisation
  dio: ^5.11.1
  connectivity_plus: ^7.3.2
  workmanager: ^0.10.10

  # Données sur le téléphone (base chiffrée par profil, clés dans le coffre-fort du système)
  drift: ^2.35.2
  sqlite3: ^3.7.1
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  path: ^1.9.1
  uuid: ^4.6.0
  crypto: ^3.0.7
  storage_space: ^1.4.0

  # Lecteurs hors ligne
  webview_flutter: ^4.14.1
  pdfx: ^2.11.0
  flutter_tts: ^4.2.5
  archive: ^4.5.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

# SQLite3MultipleCiphers : SQLite avec chiffrement (environ 0,3 Mo de plus que SQLite seul).
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/scorm/
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-Regular.ttf
        - asset: assets/fonts/Lexend-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lexend-Bold.ttf
          weight: 700
