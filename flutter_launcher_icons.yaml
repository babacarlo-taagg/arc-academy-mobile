# Icône de l'appli, générée à partir du logo d'ARC (assets/marque/, déposé par la session de publication).
# Après un changement de logo :  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/marque/icone-1024.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 28
  adaptive_icon_background: "#F6F4EF"
  adaptive_icon_foreground: "assets/marque/icone-premier-plan-1024.png"
