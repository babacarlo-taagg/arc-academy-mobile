# Icône de l'appli, générée à partir du logo d'ARC (déposé dans assets/marque/ par la session de publication).
# Quand le fichier existe :  dart run flutter_launcher_icons
# Couleur de fond de l'icône adaptative Android : à remplacer par la couleur principale d'ARC (assets/marque/couleurs.md).
flutter_launcher_icons:
  image_path: "assets/marque/icone-1024.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 28
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/marque/icone-1024.png"
